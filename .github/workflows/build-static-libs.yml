name: Build Blender 4.5 Android ARM64 Static Libs

on:
  workflow_dispatch:

env:
  NDK_VERSION: "r26d"
  NDK_URL: "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  LATEST_LIBS_RUN: "33524817186"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Blender source
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: blender-v4.5-release
          path: blender
          fetch-depth: 1

      - name: Checkout this repo (workflow + patches)
        uses: actions/checkout@v4
        with:
          path: blender-android

      - name: Download precompiled libraries from libs repo
        uses: dawidd6/action-download-artifact@v6
        with:
          repo: dexapex377-coder/libs-blender-4.5_arm64
          name: libs-blender-4.5-arm64
          run_id: 33571344515
          path: ${{ github.workspace }}/libs-dl

      - name: Extract precompiled libraries
        run: |
          cd ${{ github.workspace }}/libs-dl
          ls -lh
          mkdir -p ${{ github.workspace }}/libs
          if [ -f "libs-blender-4.5-arm64.tar.gz" ]; then
            tar xzf libs-blender-4.5-arm64.tar.gz -C ${{ github.workspace }}/libs/
          elif [ -f "*.zip" ]; then
            unzip -o *.zip -d ${{ github.workspace }}/libs/
          fi
          echo "=== Libraries ==="
          find ${{ github.workspace }}/libs -name "*.a" -o -name "*.so" | wc -l
          find ${{ github.workspace }}/libs -name "*.a" | head -20
          echo "=== Includes ==="
          find ${{ github.workspace }}/libs -maxdepth 2 -type d | head -20

      - name: Restore ccache
        uses: actions/cache/restore@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-blender45-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-blender45-${{ runner.os }}-

      - name: Download and extract NDK r26d
        run: |
          NDK_DIR="$HOME/android-ndk-r26d"
          if [ ! -d "$NDK_DIR" ]; then
            echo "Downloading NDK r26d..."
            wget -q "${{ env.NDK_URL }}" -O /tmp/ndk.zip
            echo "Extracting NDK..."
            unzip -q /tmp/ndk.zip -d "$HOME/"
            rm /tmp/ndk.zip
            echo "NDK r26d extracted to $NDK_DIR"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          ls "$NDK_DIR/ndk-build" && echo "NDK ready"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache libpython3-dev \
            libjpeg-dev libpng-dev zlib1g-dev libfreetype-dev libtiff-dev \
            libepoxy-dev libxi-dev libx11-dev libxxf86vm-dev libxcursor-dev \
            libwayland-dev libglew-dev wayland-protocols libxkbcommon-dev

      - name: Patch epoxy version check for GLES
        run: |
          BLENDER="${{ github.workspace }}/blender"
          # Patch gl_backend.cc: epoxy_gl_version() >= 43 → support GLES 3.2 (returns 32)
          # On GLES, epoxy_gl_version() returns ES_version * 10 (3.2 → 32)
          # On desktop GL, it returns the GL version (4.3 → 43)
          python3 -c "
          import os

          fpath = '$BLENDER/source/blender/gpu/opengl/gl_backend.cc'
          with open(fpath, 'r') as f:
              content = f.read()

          # Replace: epoxy_gl_version() >= 43
          # With: (epoxy_is_desktop_gl() && epoxy_gl_version() >= 43) || (!epoxy_is_desktop_gl() && epoxy_gl_version() >= 32)
          old = 'epoxy_gl_version() >= 43'
          new = '((epoxy_is_desktop_gl() && epoxy_gl_version() >= 43) || (!epoxy_is_desktop_gl() && epoxy_gl_version() >= 32))'

          count = content.count(old)
          content = content.replace(old, new)
          with open(fpath, 'w') as f:
              f.write(content)
          print(f'Patched {count} occurrences of version check in gl_backend.cc')
          "

          # Same for gl_debug.cc
          python3 -c "
          fpath = '$BLENDER/source/blender/gpu/opengl/gl_debug.cc'
          with open(fpath, 'r') as f:
              content = f.read()

          old = 'epoxy_gl_version() >= 43'
          new = '((epoxy_is_desktop_gl() && epoxy_gl_version() >= 43) || (!epoxy_is_desktop_gl() && epoxy_gl_version() >= 32))'

          count = content.count(old)
          content = content.replace(old, new)
          with open(fpath, 'w') as f:
              f.write(content)
          print(f'Patched {count} occurrences of version check in gl_debug.cc')
          "

      - name: Patch hardcoded paths in cmake modules
        run: |
          LIBS_PATH="${{ github.workspace }}/libs"
          LIBS_ABS="$(cd "$LIBS_PATH" && pwd)"

          echo "=== Patching lib paths -> $LIBS_ABS ==="
          find "${{ github.workspace }}/blender/build_files/cmake/" -type f -name "*.cmake" \
            -exec sed -i "s|LIBDIR/|${LIBS_ABS}/|g" {} + 2>/dev/null || true
          echo "=== Patching done ==="

          # Patch out freetype brotli check (our precompiled freetype doesn't have it)
          echo "=== Patching freetype brotli check ==="
          sed -i 's/function(check_freetype_for_brotli)/function(check_freetype_for_brotli)\n  set(HAVE_BROTLI TRUE CACHE BOOL "")\n  return()/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          echo "=== Freetype brotli check patched ==="

          # Make JPEG/PNG/ZLIB/Epoxy/PythonLibs not REQUIRED in platform_unix.cmake (host build doesn't need them)
          sed -i 's/find_package_wrapper(JPEG REQUIRED)/find_package_wrapper(JPEG)/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          sed -i 's/find_package_wrapper(PNG REQUIRED)/find_package_wrapper(PNG)/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          sed -i 's/find_package_wrapper(ZLIB REQUIRED)/find_package_wrapper(ZLIB)/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          sed -i 's/find_package_wrapper(Epoxy REQUIRED)/find_package_wrapper(Epoxy)/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          sed -i 's/find_package(PythonLibsUnix REQUIRED)/find_package(PythonLibsUnix)/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          sed -i 's/find_package_wrapper(OpenImageIO REQUIRED)/find_package_wrapper(OpenImageIO)/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          # Fix FindOpenImageIO.cmake crash when _openimageio_export is NOTFOUND
          python3 -c "
import re
f = '${{ github.workspace }}/blender/build_files/cmake/Modules/FindOpenImageIO.cmake'
with open(f) as fh: c = fh.read()
old = 'file(STRINGS \"\${_openimageio_export}\" _openimageio_util_define'
new = 'if(NOT _openimageio_export MATCHES \"NOTFOUND\")\n  file(STRINGS \"\${_openimageio_export}\" _openimageio_util_define'
c = c.replace(old, new, 1)
# Close the if after the file(STRINGS) block ends
old2 = 'if(_openimageio_util_define)\n  find_library(OPENIMAGEIO_UTIL_LIBRARY'
new2 = 'endif()\nif(_openimageio_util_define)\n  find_library(OPENIMAGEIO_UTIL_LIBRARY'
c = c.replace(old2, new2, 1)
with open(f, 'w') as fh: fh.write(c)
print('Patched FindOpenImageIO.cmake')
"
          sed -i 's/find_package_wrapper(Zstd REQUIRED)/find_package_wrapper(Zstd)/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          sed -i 's/find_package_wrapper(Freetype REQUIRED)/find_package_wrapper(Freetype)/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          sed -i 's/find_package_wrapper(Brotli REQUIRED)/find_package_wrapper(Brotli)/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          sed -i 's/find_package_wrapper(Vulkan REQUIRED)/find_package_wrapper(Vulkan)/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          sed -i 's/find_package_wrapper(ShaderC REQUIRED)/find_package_wrapper(ShaderC)/' \
            "${{ github.workspace }}/blender/build_files/cmake/platform/platform_unix.cmake"
          echo "=== REQUIRED removed from host cmake deps ==="

      - name: Phase 1 - Build host tools natively
        run: |
          GITROOT="${{ github.workspace }}/blender"
          HOST_TOOLS="${{ github.workspace }}/build/host_tools"
          mkdir -p "$HOST_TOOLS"

          # datatoc (renamed from .c to .cc in 4.5)
          DATATOC_SRC="$GITROOT/source/blender/datatoc/datatoc.cc"
          if [ ! -f "$DATATOC_SRC" ]; then
            DATATOC_SRC="$GITROOT/source/blender/datatoc/datatoc.c"
          fi
          g++ -O2 -o "$HOST_TOOLS/datatoc" "$DATATOC_SRC" -lm
          echo "datatoc built"

          # glsl_preprocess (NEW in 4.5)
          if [ -f "$GITROOT/source/blender/gpu/glsl_preprocess/glsl_preprocess.cc" ]; then
            g++ -std=c++20 -O2 -o "$HOST_TOOLS/glsl_preprocess" \
              "$GITROOT/source/blender/gpu/glsl_preprocess/glsl_preprocess.cc" -lm && \
              echo "glsl_preprocess built" || \
              echo "Warning: glsl_preprocess build failed"
          else
            echo "glsl_preprocess source not found, skipping"
          fi

      - name: Phase 2 - Build and run makesdna host tool
        run: |
          GITROOT="${{ github.workspace }}/blender"
          DNA_INC_DIR="$GITROOT/source/blender/makesdna"
          DNA_GEN_DIR="${{ github.workspace }}/build/host_dna_gen"
          mkdir -p "$DNA_GEN_DIR"

          # Generate includes list — ONLY from SRC_DNA_INC (lines 5-103), not defaults
          DNA_HDR_LIST=$(sed -n '5,103p' "$GITROOT/source/blender/CMakeLists.txt" \
            | sed -n 's/.*makesdna\/\(DNA_[a-zA-Z0-9_]*\.h\).*/\1/p')
          {
            echo "/* Do not edit manually */"
            echo "$DNA_HDR_LIST" | while IFS= read -r hdr; do echo "#include \"$hdr\""; done
          } > "$DNA_GEN_DIR/dna_includes_all.h"
          {
            echo "/* Do not edit manually */"
            echo "$DNA_HDR_LIST" | while IFS= read -r hdr; do echo "\"$hdr\","; done
          } > "$DNA_GEN_DIR/dna_includes_as_strings.h"
          echo "dna_includes headers generated"

          BLIB="$GITROOT/source/blender/blenlib/intern"
          GUARD="$GITROOT/intern/guardedalloc/intern"
          CFLAGS="-O2 -I$DNA_INC_DIR -I$GITROOT/source/blender/blenlib \
            -I$GITROOT/intern/atomic -I$GITROOT/intern/guardedalloc -I$DNA_GEN_DIR"

          # 4.5 uses .cc for everything — compile ALL sources from official CMakeLists.txt
          FMTLIB="$GITROOT/extern/fmtlib/include"
          g++ -std=c++20 $CFLAGS -I"$FMTLIB" -c -o /tmp/ms_main.o  "$DNA_INC_DIR/intern/makesdna.cc"
          g++ -std=c++20 $CFLAGS -I"$FMTLIB" -c -o /tmp/ms_utils.o "$DNA_INC_DIR/intern/dna_utils.cc"
          g++ $CFLAGS -c -o /tmp/ms_asrt.o "$BLIB/BLI_assert.cc"
          g++ $CFLAGS -c -o /tmp/ms_ghash.o "$BLIB/BLI_ghash.cc"
          g++ $CFLAGS -c -o /tmp/ms_gh2.o  "$BLIB/BLI_ghash_utils.cc"
          g++ $CFLAGS -c -o /tmp/ms_link.o "$BLIB/BLI_linklist.cc"
          g++ $CFLAGS -c -o /tmp/ms_mema.o "$BLIB/BLI_memarena.cc"
          g++ $CFLAGS -c -o /tmp/ms_memp.o "$BLIB/BLI_mempool.cc"
          g++ $CFLAGS -c -o /tmp/ms_endi.o "$BLIB/endian_switch.cc"
          g++ $CFLAGS -c -o /tmp/ms_list.o "$BLIB/listbase.cc"
          g++ $CFLAGS -c -o /tmp/ms_str.o  "$BLIB/string.cc"
          g++ $CFLAGS -c -o /tmp/ms_hash.o "$BLIB/hash_mm2a.cc"
          g++ $CFLAGS -c -o /tmp/ms_gsq.o "$BLIB/gsqueue.cc"
          g++ $CFLAGS -c -o /tmp/ms_thrd.o "$BLIB/threads.cc"
          g++ $CFLAGS -c -o /tmp/ms_time.o "$BLIB/time.cc"
          g++ $CFLAGS -c -o /tmp/ms_ml1.o "$GUARD/mallocn.cc"
          g++ $CFLAGS -c -o /tmp/ms_ml2.o "$GUARD/mallocn_guarded_impl.cc"
          g++ $CFLAGS -c -o /tmp/ms_ml3.o "$GUARD/mallocn_lockfree_impl.cc"
          g++ $CFLAGS -c -o /tmp/ms_leak.o "$GUARD/leak_detector.cc"
          g++ $CFLAGS -c -o /tmp/ms_mem.o  "$GUARD/memory_usage.cc"

          g++ -o /tmp/makesdna \
            /tmp/ms_main.o /tmp/ms_utils.o /tmp/ms_asrt.o /tmp/ms_ghash.o \
            /tmp/ms_gh2.o /tmp/ms_link.o /tmp/ms_mema.o /tmp/ms_memp.o \
            /tmp/ms_endi.o /tmp/ms_list.o /tmp/ms_str.o /tmp/ms_hash.o \
            /tmp/ms_gsq.o /tmp/ms_thrd.o /tmp/ms_time.o \
            /tmp/ms_ml1.o /tmp/ms_ml2.o /tmp/ms_ml3.o \
            /tmp/ms_leak.o /tmp/ms_mem.o \
            -lm -lpthread
          echo "makesdna compiled"

          /tmp/makesdna \
            "$DNA_GEN_DIR/dna.c" \
            "$DNA_GEN_DIR/dna_type_offsets.h" \
            "$DNA_GEN_DIR/dna_verify.c" \
            "$DNA_GEN_DIR/dna_struct_ids.cc" \
            "$DNA_INC_DIR/"
          echo "DNA files generated"

          HOST_TOOLS="${{ github.workspace }}/build/host_tools"
          cp /tmp/makesdna "$HOST_TOOLS/makesdna"
          cp "$DNA_GEN_DIR/dna_includes_all.h" "$DNA_GEN_DIR/dna_includes_as_strings.h" \
            "$DNA_GEN_DIR/dna.c" "$DNA_GEN_DIR/dna_type_offsets.h" "$DNA_GEN_DIR/dna_verify.c" \
            "$DNA_GEN_DIR/dna_struct_ids.cc" \
            "$HOST_TOOLS/"

      - name: Phase 3 - Configure CMake for makesrna
        shell: bash -o pipefail {0}
        run: |
          GITROOT="${{ github.workspace }}/blender"
          LIB_DIR="${{ github.workspace }}/libs"

          cmake -S "$GITROOT" -B "${{ github.workspace }}/build_host" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIB_DIR="${LIB_DIR}" \
            -DWITH_BLENDER=ON \
            -DWITH_PYTHON=OFF \
            -DWITH_INTERNATIONAL=OFF \
            -DWITH_CODEC_FFMPEG=OFF \
            -DWITH_OPENAL=OFF \
            -DWITH_SDL=OFF \
            -DWITH_GHOST_X11=OFF \
            -DWITH_GHOST_WAYLAND=OFF \
            -DWITH_JACK=OFF \
            -DWITH_PULSEAUDIO=OFF \
            -DWITH_OPENCOLLADA=OFF \
            -DWITH_OPENSUBDIV=OFF \
            -DWITH_OPENVDB=OFF \
            -DWITH_NANOVDB=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_USD=OFF \
            -DWITH_MATERIALX=OFF \
            -DWITH_CYCLES=OFF \
            -DWITH_TBB=OFF \
            -DWITH_OPENIMAGEDENOISE=OFF \
            -DWITH_FFTW3=OFF \
            -DWITH_GMP=OFF \
            -DWITH_POTRACE=OFF \
            -DWITH_GTESTS=OFF \
            -DWITH_VULKAN_BACKEND=OFF \
            -DWITH_BUILDINFO=OFF \
            -DWITH_BULLET=OFF \
            -DWITH_AUDASPACE=OFF \
            -DWITH_MOD_FLUID=OFF \
            -DWITH_FREESTYLE=OFF \
            -DWITH_IMAGE_OPENEXR=OFF \
            -DWITH_IMAGE_CINEON=OFF \
            -DWITH_IMAGE_TIFF=OFF \
            -DWITH_IMAGE_JPEG=OFF \
            -DWITH_IMAGE_PNG=OFF \
            -DWITH_MOD_OCEANSIM=OFF \
            -DWITH_MOD_REMESH=OFF \
            -DWITH_XR_OPENXR=OFF \
            -DWITH_MEM_VALGRIND=OFF \
            -DWITH_HARU=OFF \
            -DWITH_LZO=OFF \
            -DWITH_LLVM=OFF \
            -DWITH_INSTALL_PORTABLE=ON \
            2>&1 | tee /tmp/cmake_phase3.log
          echo "Phase 3 cmake exit: $?"

      - name: Phase 4 - Build and run makesrna
        run: |
          GITROOT="${{ github.workspace }}/blender"
          HOST_TOOLS="${{ github.workspace }}/build/host_tools"
          BUILD_HOST="${{ github.workspace }}/build_host"

          echo "=== Building bf_dna ==="
          ninja -C "$BUILD_HOST" bf_dna 2>&1 | tail -20
          echo "=== Building bf_dna_blenlib ==="
          ninja -C "$BUILD_HOST" bf_dna_blenlib 2>&1 | tail -20
          echo "=== Building makesrna ==="
          ninja -C "$BUILD_HOST" makesrna 2>&1 | tail -20

          RNA_GEN_DIR="$BUILD_HOST/source/blender/makesrna/intern"

          # Copy libs
          cp "$BUILD_HOST/lib/libbf_dna.a" "$HOST_TOOLS/" 2>/dev/null || \
            cp "$BUILD_HOST/source/blender/makesdna/intern/libbf_dna.a" "$HOST_TOOLS/" 2>/dev/null || true
          cp "$BUILD_HOST/lib/libbf_dna_blenlib.a" "$HOST_TOOLS/" 2>/dev/null || \
            cp "$BUILD_HOST/source/blender/makesdna/intern/libbf_dna_blenlib.a" "$HOST_TOOLS/" 2>/dev/null || true
          cp "$BUILD_HOST/lib/libmakesrna.a" "$HOST_TOOLS/" 2>/dev/null || \
            cp "$BUILD_HOST/source/blender/makesrna/intern/libmakesrna.a" "$HOST_TOOLS/" 2>/dev/null || true

          # Find and copy makesrna binary
          find "$BUILD_HOST" -name "makesrna" -type f -executable 2>/dev/null | head -3
          find "$BUILD_HOST" -name "makesrna*" -type f 2>/dev/null | head -5

          # Link makesrna if libs exist
          if [ -f "$HOST_TOOLS/libbf_dna.a" ] && [ -f "$HOST_TOOLS/libbf_dna_blenlib.a" ] && [ -f "$HOST_TOOLS/libmakesrna.a" ]; then
            g++ -o /tmp/makesrna \
              -Wl,--start-group \
              "$HOST_TOOLS/libbf_dna.a" \
              "$HOST_TOOLS/libbf_dna_blenlib.a" \
              "$HOST_TOOLS/libmakesrna.a" \
              -Wl,--end-group \
              -lm -lpthread
            echo "makesrna linked"
            /tmp/makesrna "$RNA_GEN_DIR/" "$BUILD_HOST/source/blender/makesrna/"
            echo "makesrna ran"
            cp "$RNA_GEN_DIR"/*.c "$RNA_GEN_DIR"/*.h "$HOST_TOOLS/" 2>/dev/null || true
            cp /tmp/makesrna "$HOST_TOOLS/makesrna"
          else
            echo "Some libs missing, trying cmake build of makesrna directly..."
            # Maybe makesrna is already a standalone binary from cmake
            find "$BUILD_HOST" -name "makesrna" -not -type d 2>/dev/null
          fi

      - name: Phase 5 - Configure CMake for cross-compile
        shell: bash -o pipefail {0}
        run: |
          GITROOT="${{ github.workspace }}/blender"
          LIB_DIR="${{ github.workspace }}/libs"
          NDK_DIR="${{ env.ANDROID_NDK_HOME }}"
          HOST_TOOLS="${{ github.workspace }}/build/host_tools"

          echo "=== LIB_DIR=$LIB_DIR ==="
          ls -la "$LIB_DIR/lib/" 2>/dev/null | head -15
          ls -la "$LIB_DIR/include/" 2>/dev/null | head -15

          cmake -S "$GITROOT" -B "${{ github.workspace }}/build" \
            -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_DIR}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-fvisibility=default" \
            -DCMAKE_CXX_FLAGS="-fvisibility=default -std=c++20" \
            -DLIBDIR="$LIB_DIR" \
            -DCMAKE_PREFIX_PATH="$LIB_DIR" \
            -DCMAKE_FIND_ROOT_PATH="$LIB_DIR" \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DJPEG_LIBRARY="$LIB_DIR/lib/libjpeg.a" \
            -DJPEG_INCLUDE_DIR="$LIB_DIR/include" \
            -DPNG_LIBRARY="$LIB_DIR/lib/libpng16.a" \
            -DPNG_PNG_INCLUDE_DIR="$LIB_DIR/include" \
            -DZLIB_LIBRARY="$LIB_DIR/lib/libz.a" \
            -DZLIB_INCLUDE_DIR="$LIB_DIR/include" \
            -DFREETYPE_LIBRARY="$LIB_DIR/lib/libfreetype.a" \
            -DFREETYPE_INCLUDE_DIR="$LIB_DIR/include/freetype2" \
            -DTIFF_LIBRARY="$LIB_DIR/lib/libtiff.a" \
            -DTIFF_INCLUDE_DIR="$LIB_DIR/include" \
            -DWITH_LIBS_PRECOMPILED=ON \
            -DDATATOC_EXECUTABLE="$HOST_TOOLS/datatoc" \
            -DGLSL_PREPROCESS_EXECUTABLE="$HOST_TOOLS/glsl_preprocess" \
            -DMAKESDNA_EXECUTABLE="$HOST_TOOLS/makesdna" \
            -DMAKESRNA_EXECUTABLE="$HOST_TOOLS/makesrna" \
            -DWITH_BLENDER=ON \
            -DWITH_PYTHON=OFF \
            -DWITH_INTERNATIONAL=ON \
            -DWITH_MOD_FLUID=OFF \
            -DWITH_CODEC_FFMPEG=OFF \
            -DWITH_OPENAL=OFF \
            -DWITH_SDL=OFF \
            -DWITH_GHOST_X11=OFF \
            -DWITH_GHOST_WAYLAND=OFF \
            -DWITH_JACK=OFF \
            -DWITH_PULSEAUDIO=OFF \
            -DWITH_OPENCOLLADA=OFF \
            -DWITH_OPENSUBDIV=ON \
            -DWITH_OPENVDB=OFF \
            -DWITH_NANOVDB=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_USD=OFF \
            -DWITH_MATERIALX=OFF \
            -DWITH_CYCLES=OFF \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_CYCLES_EMBREE=ON \
            -DWITH_TBB=ON \
            -DWITH_OPENIMAGEDENOISE=OFF \
            -DWITH_FFTW3=OFF \
            -DWITH_GMP=OFF \
            -DWITH_POTRACE=OFF \
            -DWITH_LLVM=OFF \
            -DWITH_GTESTS=OFF \
            -DWITH_VULKAN_BACKEND=OFF \
            -DWITH_INSTALL_PORTABLE=ON \
            -DWITH_BUILDINFO=OFF \
            -DWITH_HEADLESS=ON \
            -DWITH_COMPILER_CCACHE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWITH_STRICT_BUILD_OPTIONS=OFF \
            2>&1 | tee /tmp/cmake_phase5.log
          CMAKE_EXIT=$?
          echo "=== CMake configure exit code: $CMAKE_EXIT ==="
          tail -20 /tmp/cmake_phase5.log
          if [ "$CMAKE_EXIT" -ne 0 ]; then
            echo "ERROR: CMake configure failed"
            exit 1
          fi

      - name: Patch host tool paths in build.ninja
        run: |
          BUILD_DIR="${{ github.workspace }}/build"
          NINJA_FILE="$BUILD_DIR/build.ninja"
          HOST_TOOLS="${{ github.workspace }}/build/host_tools"

          for tool in datatoc glsl_preprocess; do
            SRC="${{ github.workspace }}/blender/build/bin/${tool}"
            DST="${HOST_TOOLS}/${tool}"
            if [ -f "$DST" ]; then
              count=$(grep -c "$SRC" "$NINJA_FILE" 2>/dev/null || echo 0)
              if [ "$count" -gt 0 ]; then
                sed -i "s|$SRC|$DST|g" "$NINJA_FILE"
                echo "Patched $tool: $count occurrences"
              fi
            fi
          done

      - name: Stage DNA and RNA files
        run: |
          # DNA
          HOST_DNA_DIR="${{ github.workspace }}/build/host_dna_gen"
          CROSS_DNA_DIR="${{ github.workspace }}/build/source/blender/makesdna/intern"
          mkdir -p "$CROSS_DNA_DIR"
          for f in "$HOST_DNA_DIR"/*.h "$HOST_DNA_DIR"/*.c "$HOST_DNA_DIR"/*.cc; do
            [ -f "$f" ] && cp -v "$f" "$CROSS_DNA_DIR/" || true
          done

          # RNA
          HOST_RNA_DIR="${{ github.workspace }}/build_host/source/blender/makesrna/intern"
          CROSS_RNA_DIR="${{ github.workspace }}/build/source/blender/makesrna/intern"
          mkdir -p "$CROSS_RNA_DIR"
          if [ -d "$HOST_RNA_DIR" ]; then
            for f in "$HOST_RNA_DIR"/*.c "$HOST_RNA_DIR"/*.cc "$HOST_RNA_DIR"/*.h; do
              [ -f "$f" ] && cp -v "$f" "$CROSS_RNA_DIR/" || true
            done
          else
            echo "WARNING: HOST_RNA_DIR does not exist (makesrna likely failed)"
          fi
          echo "DNA files staged: $(ls "$CROSS_DNA_DIR/" | wc -l)"
          echo "RNA files staged: $(ls "$CROSS_RNA_DIR/" | wc -l)"

      - name: Cross-compile static libraries
        shell: bash -o pipefail {0}
        run: |
          BUILD_DIR="${{ github.workspace }}/build"
          cd "$BUILD_DIR"

          echo "=== Enumerating library targets ==="
          LIB_TARGETS=$(ninja -t targets all 2>/dev/null | grep -E '^(bf_|extern_|cycles_|makesdna|makesrna|draco)' | sed 's/:.*//' | sort -u)
          TARGET_COUNT=$(echo "$LIB_TARGETS" | wc -l)
          echo "Found $TARGET_COUNT library targets"

          if [ "$TARGET_COUNT" -eq 0 ]; then
            echo "ERROR: No library targets found!"
            ninja -t targets all 2>/dev/null | head -100
            exit 1
          fi

          echo "=== Building $TARGET_COUNT static library targets ==="
          set -o pipefail
          ninja -j$(nproc) $LIB_TARGETS 2>&1 | tee /tmp/build.log
          NINJA_STATUS=$?
          echo "=== Static library build complete ==="
          if [ "$NINJA_STATUS" -ne 0 ]; then
            echo "ERROR: ninja failed with exit code $NINJA_STATUS"
            tail -50 /tmp/build.log
            exit 1
          fi
        timeout-minutes: 180

      - name: Package static libraries
        run: |
          cd ${{ github.workspace }}
          find blender/build -name "*.a" -type f | zip -@ build/blender-4.5-android-arm64-static-libs.zip
          echo "=== Package info ==="
          ls -lh build/blender-4.5-android-arm64-static-libs.zip

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload static libraries artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.5-android-arm64-static-libs
          path: ${{ github.workspace }}/build/blender-4.5-android-arm64-static-libs.zip
          retention-days: 30

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-blender45-${{ runner.os }}-${{ github.sha }}
